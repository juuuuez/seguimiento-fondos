<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cuaderno de fondos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f5; --surface:#ffffff; --ink:#17171a; --muted:#71717a; --line:#e4e4e7; --soft:#efeff1;
  --pos:#35654f; --neg:#9a3f3f; --posbar:#9fbfae; --negbar:#d3a3a3; --shadow:0 1px 2px rgba(20,20,26,.04), 0 6px 20px rgba(20,20,26,.05);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0f0f11; --surface:#18181b; --ink:#ececee; --muted:#9a9aa3; --line:#2a2a2f; --soft:#212126;
  --pos:#86bda2; --neg:#dd9393; --posbar:#44705b; --negbar:#7d4b4b; --shadow:none; color-scheme:dark; } }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:0; padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px));
  min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{width:100%;max-width:1040px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 8px;min-height:64px}
.brand{font-size:14px;font-weight:500;letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.brand[hidden]{display:none}
.back{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--ink)}
main{flex:1;padding:8px 0 40px}
footer{padding:20px 0 28px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line)}
footer a{color:var(--muted)}
footer a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

/* Portada */
.home{min-height:62vh;display:flex;flex-direction:column;justify-content:center;gap:44px;padding:24px 0 12px}
h1{margin:0;font-family:var(--serif);font-optical-sizing:auto;font-size:clamp(42px,6.8vw,66px);font-weight:400;letter-spacing:-.015em;line-height:1.05;text-wrap:balance}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{display:flex;flex-direction:column;justify-content:space-between;gap:34px;min-height:150px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}
.choice:hover{transform:translateY(-2px);border-color:var(--ink)}
.choice small{display:block;color:var(--muted);font-size:13px}
.choice strong{display:block;font-family:var(--serif);font-optical-sizing:auto;font-size:27px;font-weight:400;letter-spacing:-.01em;line-height:1.12}
.choice .row{display:flex;justify-content:space-between;align-items:flex-end}
.choice svg{flex:none;color:var(--muted)}
.choice:hover svg{color:var(--ink)}
@media (prefers-reduced-motion: reduce){.choice{transition:none}.choice:hover{transform:none}}
@media (max-width:640px){.choices{grid-template-columns:1fr}.choice{min-height:120px}}

/* Buscador */
.search{position:relative}
.search input{width:100%;padding:15px 18px 15px 48px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--ink)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{margin:8px 0 0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:46vh;overflow:auto}
.results[hidden]{display:none}
.results a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 12px;border-radius:10px;text-decoration:none}
.results a:hover,.results a.on{background:var(--soft)}
.results .n{min-width:0}
.results .n b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .n span,.results .t{font-size:12px;color:var(--muted);white-space:nowrap}
.results .vacio{padding:14px 12px;color:var(--muted);font-size:14px}

/* Sección */
h2{margin:0;font-family:var(--serif);font-optical-sizing:auto;font-size:clamp(31px,4.8vw,44px);font-weight:400;letter-spacing:-.015em;line-height:1.1}
.sechead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin:6px 0 22px}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.linkbtn{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.linkbtn:hover{color:var(--ink);border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:14px}
.filters .search{flex:1 1 260px;max-width:360px}
.filters .search input{padding:10px 14px 10px 40px;font-size:14px;border-radius:12px;box-shadow:none}
.filters .search svg{left:14px;width:16px;height:16px}

/* Lista */
.lista{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.lista .row{display:grid;gap:14px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lista .row:last-child{border-bottom:0}
.lista a.row:hover{background:var(--soft)}
.lista .head{font-size:12px;color:var(--muted);padding-top:12px;padding-bottom:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.lista .head button{border:0;background:none;padding:0;color:inherit;cursor:pointer;text-align:inherit;font-size:12px}
.lista .head button:hover,.lista .head button.on{color:var(--ink)}
.lista .head button.on::after{content:attr(data-dir);margin-left:4px}
.rf .row{grid-template-columns:minmax(0,2.5fr) repeat(7,minmax(0,1fr))}
.rv .row{grid-template-columns:minmax(0,3fr) repeat(5,minmax(0,1fr))}
.nm{min-width:0}
.nm b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;font-weight:500;line-height:1.3}
.nm span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.num.c{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .nd{color:var(--muted);opacity:.6}
.mini{display:block;height:3px;margin-top:5px;border-radius:2px;margin-left:auto;background:var(--posbar)}
.mini.neg{background:var(--negbar)}
@media (max-width:720px){
  .rf .row{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:8px}
  .rv .row{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:8px}
  .lista a.row .nm{grid-column:1/-1}
  .lista .head>button:first-child{display:none}
  .lista .head{row-gap:0}
  .hide-m{display:none}
  .lista .row{padding:13px 16px;gap:10px}
  .nm b{-webkit-line-clamp:3;line-clamp:3}
}

/* Gráficos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px}
.scatter{position:relative}
.scatter svg{display:block;width:100%;height:auto}
.scatter text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.scatter .g{stroke:var(--line)}
.scatter circle{fill:var(--ink);fill-opacity:.55;stroke:var(--surface);stroke-width:1.5;cursor:pointer;transition:fill-opacity .15s}
.scatter circle:hover{fill-opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;max-width:240px;z-index:3}
.tip b{display:block;font-weight:500}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:minmax(120px,32%) 1fr 64px;gap:12px;align-items:center;padding:5px 6px;border-radius:8px;text-decoration:none}
.bar:hover{background:var(--soft)}
.bar .l{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{position:relative;height:10px}
.bar .tr i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--posbar)}
.bar .tr i.neg{background:var(--negbar)}
.bar .tr u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.bar .v{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.bar{grid-template-columns:minmax(90px,38%) 1fr 54px;gap:8px}}

/* Ficha del fondo */
.fund h2{margin-bottom:6px}
.fund .sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.tile.key{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tile.key small{color:var(--bg);opacity:.65}
.tile small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.tile strong{font-size:22px;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:10px 2px 0}
.blocks{display:grid;gap:26px;margin-top:34px;max-width:70ch}
.blocks h3{margin:0 0 6px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.blocks p{margin:0}
.ficha{display:flex;gap:16px;align-items:center;margin-top:26px;padding:12px;width:max-content;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;box-shadow:var(--shadow);transition:border-color .18s ease}
.ficha:hover{border-color:var(--ink)}
.ficha img{display:block;width:110px;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
.ficha .ft{display:flex;flex-direction:column;gap:2px;padding-right:10px}
.ficha .ft b{font-weight:500}
.ficha .ft small{color:var(--muted);font-size:12px}
.ficha .dl{margin-top:8px;font-size:12px;color:var(--ink);border-bottom:1px solid var(--line);align-self:flex-start}
.cap{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.quote p{margin:0 0 12px}
.quote{border-left:2px solid var(--line);padding-left:16px}
.qbox.cut{max-height:15em;overflow:hidden;position:relative}
.qbox.cut::after{content:"";position:absolute;inset:auto 0 0 0;height:5em;background:linear-gradient(transparent,var(--bg))}
.more{margin-top:8px;border:0;background:none;padding:0;font-size:13px;color:var(--ink);border-bottom:1px solid var(--line);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:30px;padding:12px 20px;border-radius:12px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:14px}
.btn:hover{opacity:.88}
.btn small{font-weight:400;opacity:.65}

/* Visión general */
.vision{max-width:68ch}
.vision h3{margin:34px 0 8px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vision h3:first-of-type{margin-top:12px}
.vision p{margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" id="back" href="#/" hidden>← Inicio</a><a class="brand" id="brand" href="#/" hidden>Cuaderno de fondos</a></div>
  <main id="app" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const svgNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) { const e = document.createElementNS(svgNS, tag); for (const k in (attrs || {})) e.setAttribute(k, attrs[k]); kids.forEach(c => e.append(c.nodeType ? c : document.createTextNode(c))); return e; }
const norm = t => (t || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const nf = (v, d) => v.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1, sign = true) => (v == null || isNaN(v)) ? '–' : (sign && v > 0 ? '+' : '') + nf(v, d) + '%';
const cls = v => (v == null || isNaN(v)) ? 'nd' : (v >= 0 ? 'pos' : 'neg');
const icon = {
  search: () => s('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linecap': 'round' }, s('circle', { cx: 11, cy: 11, r: 7 }), s('path', { d: 'M20 20l-3.5-3.5' })),
  arrow: () => s('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s('path', { d: 'M5 12h14M13 6l6 6-6 6' }))
};

let D = { rf: [], rv: [], vis: [], meta: {} }, ALL = [];
const ST = { rf: { key: 'ytd', dir: -1, mode: 'lista', q: '' }, rv: { key: 'ytd', dir: -1, mode: 'lista', q: '', chip: 'Todos', per: 'ytd' } };
const PERIODS = [['ytd', 'Año'], ['a1', '1 año'], ['r3', '3 años'], ['r5', '5 años'], ['r10', '10 años']];

async function load() {
  const j = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });
  const [rf, rv, vis, meta] = await Promise.all([j('data/renta_fija.json'), j('data/renta_variable.json'), j('data/vision_general.json'), j('data/meta.json').catch(() => ({}))]);
  D = { rf, rv, vis, meta };
  ALL = [...rf.map(f => ({ ...f, kind: 'rf', bloque: 'Renta fija' })), ...rv.map(f => ({ ...f, kind: 'rv', fecha: f.fecha_ficha }))];
  $('#foot').replaceChildren(
    h('span', {}, meta.cierre ? 'Datos a ' + meta.cierre : ''),
    h('a', { href: 'descargas/Seguimiento_Fondos.xlsx' }, 'Excel'),
    h('span', {}, 'Información orientativa. Las rentabilidades pasadas no garantizan resultados futuros.'));
}

/* ---------- buscador ---------- */
function search(opts) {
  opts = opts || {};
  const input = h('input', { type: 'search', placeholder: 'Buscar por nombre o ISIN', 'aria-label': 'Buscar por nombre o ISIN', autocomplete: 'off', spellcheck: 'false', value: opts.value || '' });
  const list = h('ul', { class: 'results', hidden: true, role: 'listbox' });
  const box = h('div', { class: 'search' }, icon.search(), input, opts.inline ? null : list);
  let cur = -1;
  const find = q => {
    const t = norm(q).split(/\s+/).filter(Boolean);
    if (!t.length) return [];
    return ALL.map(f => { const hay = norm(f.fondo + ' ' + f.gestora + ' ' + f.isin); if (!t.every(x => hay.includes(x))) return null;
      return { f, sc: (norm(f.fondo).startsWith(t[0]) || norm(f.isin).startsWith(t[0])) ? 0 : 1 }; }).filter(Boolean).sort((a, b) => a.sc - b.sc || a.f.fondo.localeCompare(b.f.fondo, 'es')).map(x => x.f);
  };
  const render = () => {
    if (opts.inline) { opts.onInput && opts.onInput(input.value); return; }
    const r = find(input.value); cur = -1;
    list.replaceChildren();
    if (!input.value.trim()) { list.hidden = true; return; }
    list.hidden = false;
    if (!r.length) { list.append(h('li', { class: 'vacio' }, 'Ningún fondo coincide')); return; }
    r.slice(0, 12).forEach(f => list.append(h('li', {}, h('a', { href: '#/fondo/' + encodeURIComponent(f.isin) },
      h('span', { class: 'n' }, h('b', {}, f.fondo), h('span', {}, f.gestora + ' · ' + f.isin)), h('span', { class: 't' }, f.kind === 'rf' ? 'Renta fija' : f.bloque)))));
    if (r.length > 12) list.append(h('li', { class: 'vacio' }, '+' + (r.length - 12) + ' más: afina la búsqueda'));
  };
  input.addEventListener('input', render);
  input.addEventListener('keydown', e => {
    if (opts.inline) return;
    const items = [...list.querySelectorAll('a')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % (items.length || 1); items.forEach((a, i) => a.classList.toggle('on', i === cur)); }
    else if (e.key === 'Enter' && items.length) { location.hash = (items[cur >= 0 ? cur : 0]).getAttribute('href'); }
    else if (e.key === 'Escape') { input.value = ''; render(); }
  });
  return box;
}

/* ---------- portada ---------- */
function choice(href, small, big, glyph) {
  return h('a', { class: 'choice', href }, h('div', { class: 'row' }, h('div', {}, h('small', {}, small), h('strong', {}, big)), glyph), h('span', {}, icon.arrow()));
}
const glyphRF = () => s('svg', { width: 34, height: 34, viewBox: '0 0 34 34', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s('path', { d: 'M4 26h6v-6h6v-6h6v-6h8' }));
const glyphRV = () => s('svg', { width: 34, height: 34, viewBox: '0 0 34 34', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s('path', { d: 'M4 24l7-9 6 5 6-11 7 7' }));
function viewHome() {
  return h('section', { class: 'home' }, h('h1', {}, 'Cuaderno de fondos'),
    h('div', { class: 'choices' }, choice('#/rf', 'Fondos de', 'Renta fija', glyphRF()), choice('#/rv', 'Fondos de', 'Renta variable y mixtos', glyphRV())),
    search());
}

/* ---------- sección ---------- */
function sortRows(rows, st) {
  return rows.slice().sort((a, b) => {
    const x = a[st.key], y = b[st.key];
    const nx = x == null || x === '', ny = y == null || y === '';
    if (nx && ny) return a.fondo.localeCompare(b.fondo, 'es'); if (nx) return 1; if (ny) return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'es')) * st.dir;
  });
}
function viewSection(kind) {
  const st = ST[kind], rf = kind === 'rf';
  const title = rf ? 'Renta fija' : 'Renta variable y mixtos';
  const body = h('div', {});
  const draw = () => {
    let rows = ALL.filter(f => f.kind === kind);
    if (!rf && st.chip !== 'Todos') rows = rows.filter(f => f.bloque === st.chip);
    const q = norm(st.q).split(/\s+/).filter(Boolean);
    if (q.length) rows = rows.filter(f => { const hay = norm(f.fondo + ' ' + f.gestora + ' ' + f.isin); return q.every(x => hay.includes(x)); });
    body.replaceChildren(st.mode === 'lista' ? list(rows) : chart(rows));
  };
  const cols = rf ? [['tir', 'TIR', ''], ['duracion', 'Dur.', 'hide-m c'], ['ytd', 'Año'], ['a1', '1 año'], ['r3', '3 años'], ['r5', '5 años', 'hide-m'], ['r10', '10 años', 'hide-m']]
                  : [['ytd', 'Año'], ['a1', '1 año'], ['r3', '3 años'], ['r5', '5 años', 'hide-m'], ['r10', '10 años', 'hide-m']];
  const list = rows => {
    const sorted = sortRows(rows, st);
    const maxAbs = Math.max(1, ...sorted.map(f => Math.abs(f.ytd || 0)));
    const head = h('div', { class: 'row head' }, h('button', { 'data-k': 'fondo', class: st.key === 'fondo' ? 'on' : '', 'data-dir': st.dir > 0 ? '↑' : '↓', onclick: () => sortBy('fondo') }, 'Fondo'),
      cols.map(([k, l, c]) => h('div', { class: 'num ' + (c || '').replace(' c', '') }, h('button', { class: st.key === k ? 'on' : '', 'data-dir': st.dir > 0 ? '↑' : '↓', onclick: () => sortBy(k) }, l))));
    const out = h('div', { class: 'lista ' + kind }, head);
    if (!sorted.length) out.append(h('div', { class: 'row' }, h('span', { class: 'nm' }, 'Ningún fondo coincide')));
    sorted.forEach(f => out.append(h('a', { class: 'row', href: '#/fondo/' + encodeURIComponent(f.isin) },
      h('div', { class: 'nm' }, h('b', {}, f.fondo), h('span', {}, f.gestora)),
      cols.map(([k, , c]) => {
        const v = f[k];
        if (k === 'tir') return h('div', { class: 'num ' + (c || '') }, v == null ? h('span', { class: 'nd' }, '–') : nf(v, 1) + '%');
        if (k === 'duracion') return h('div', { class: 'num c ' + (c || '').replace(' c', '') }, v == null ? h('span', { class: 'nd' }, '–') : nf(v, 1));
        return h('div', { class: 'num ' + (c || '') }, h('span', { class: cls(v) }, pct(v)),
          k === 'ytd' && v != null ? h('i', { class: 'mini ' + (v < 0 ? 'neg' : ''), style: 'width:' + Math.max(4, Math.abs(v) / maxAbs * 100) + '%' }) : null);
      }))));
    return out;
  };
  const sortBy = k => { if (st.key === k) st.dir = -st.dir; else { st.key = k; st.dir = k === 'fondo' ? 1 : -1; } draw(); };
  const chart = rows => rf ? scatter(rows) : bars(rows);
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Vista' },
    h('button', { 'aria-pressed': st.mode === 'lista', onclick: e => setMode('lista') }, 'Lista'),
    h('button', { 'aria-pressed': st.mode === 'grafico', onclick: e => setMode('grafico') }, 'Gráfico'));
  const setMode = m => { st.mode = m; [...seg.querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-pressed', String((i === 0) === (m === 'lista')))); draw(); renderPer(); };
  const perBox = h('div', {});
  const renderPer = () => {
    perBox.replaceChildren();
    if (rf || st.mode !== 'grafico') return;
    perBox.append(h('div', { class: 'seg', role: 'group', 'aria-label': 'Periodo' }, PERIODS.map(([k, l]) => h('button', { 'aria-pressed': st.per === k, onclick: () => { st.per = k; draw(); renderPer(); } }, l))));
  };
  const sinput = search({ inline: true, value: st.q, onInput: v => { st.q = v; draw(); } });
  const filters = h('div', { class: 'filters' }, sinput, perBox);
  if (!rf) {
    const CHIPS = [['Todos', 'Todos'], ['Renta variable', 'Renta variable'], ['Mixto', 'Mixtos'], ['Metales / recursos', 'Metales']];
    const chips = h('div', { class: 'seg', role: 'group', 'aria-label': 'Bloque' }, CHIPS.map(([c, l]) =>
      h('button', { 'data-c': c, 'aria-pressed': st.chip === c, onclick: () => { st.chip = c; [...chips.querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === c))); draw(); } }, l)));
    filters.prepend(chips);
  }
  const root = h('section', {}, h('div', { class: 'sechead' }, h('h2', {}, title),
    h('div', { class: 'tools' }, seg, h('a', { class: 'linkbtn', href: '#/vision/' + kind }, 'Visión general'))), filters, body);
  draw(); renderPer();
  return root;
}

function scatter(rows) {
  const pts = rows.filter(f => f.tir != null && f.duracion != null);
  const box = h('div', { class: 'panel scatter' });
  if (!pts.length) { box.append('Sin datos'); return box; }
  const W = 880, H = 420, m = { l: 46, r: 18, t: 14, b: 42 };
  const niceMax = v => { const st = v <= 6 ? 1 : v <= 14 ? 2 : 5; return Math.ceil(v / st) * st; };
  const xm = niceMax(Math.max(...pts.map(f => f.duracion)) * 1.04), ym = niceMax(Math.max(...pts.map(f => f.tir)) * 1.04);
  const x = v => m.l + v / xm * (W - m.l - m.r), y = v => H - m.b - v / ym * (H - m.t - m.b);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'TIR frente a duración de cada fondo' });
  const tick = (max) => { const st = max <= 6 ? 1 : max <= 12 ? 2 : 5; const o = []; for (let v = 0; v <= max + 1e-9; v += st) o.push(v); return o; };
  tick(ym).forEach(v => { svg.append(s('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: 'g' }), s('text', { x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end' }, v + '%')); });
  tick(xm).forEach(v => svg.append(s('text', { x: x(v), y: H - m.b + 18, 'text-anchor': 'middle' }, v)));
  svg.append(s('text', { x: W - m.r, y: H - 6, 'text-anchor': 'end' }, 'Duración, años'), s('text', { x: m.l, y: 10 }, 'TIR'));
  const tip = h('div', { class: 'tip', hidden: true });
  pts.forEach(f => {
    const c = s('circle', { cx: x(f.duracion), cy: y(f.tir), r: 6, tabindex: 0, role: 'link', 'aria-label': f.fondo });
    const show = ev => { const r = box.getBoundingClientRect(); tip.hidden = false; tip.replaceChildren(h('b', {}, f.fondo), nf(f.tir, 1) + '% · ' + nf(f.duracion, 1) + ' años');
      tip.style.left = Math.min(Math.max(ev.clientX - r.left + 12, 0), r.width - 200) + 'px'; tip.style.top = Math.max(ev.clientY - r.top - 54, 0) + 'px'; };
    c.addEventListener('pointerenter', show); c.addEventListener('pointermove', show); c.addEventListener('pointerleave', () => tip.hidden = true);
    c.addEventListener('click', () => location.hash = '#/fondo/' + encodeURIComponent(f.isin));
    c.addEventListener('keydown', e => { if (e.key === 'Enter') location.hash = '#/fondo/' + encodeURIComponent(f.isin); });
    svg.append(c);
  });
  box.append(svg, tip);
  return box;
}
function bars(rows) {
  const key = ST.rv.per;
  const data = rows.filter(f => f[key] != null).sort((a, b) => b[key] - a[key]);
  const box = h('div', { class: 'panel' });
  if (!data.length) { box.append('Sin datos'); return box; }
  const lo = Math.min(0, ...data.map(f => f[key])), hi = Math.max(0, ...data.map(f => f[key])), span = hi - lo || 1, z = (0 - lo) / span * 100;
  const wrap = h('div', { class: 'bars' });
  data.forEach(f => {
    const v = f[key], w = Math.abs(v) / span * 100;
    wrap.append(h('a', { class: 'bar', href: '#/fondo/' + encodeURIComponent(f.isin), title: f.fondo }, h('span', { class: 'l' }, f.fondo),
      h('span', { class: 'tr' }, h('u', { style: 'left:' + z + '%' }), h('i', { class: v < 0 ? 'neg' : '', style: 'left:' + (v < 0 ? z - w : z) + '%;width:' + Math.max(w, .4) + '%' })),
      h('span', { class: 'v ' + cls(v) }, pct(v))));
  });
  box.append(wrap);
  return box;
}

/* ---------- ficha ---------- */
const placeholder = t => !t || /^[\s—–-]*$/.test(t) || (t.length < 60 && /^sin (comentario|ficha)/i.test(t.trim()));
function viewFund(isin) {
  const f = ALL.find(x => x.isin === isin);
  if (!f) return h('section', {}, h('h2', {}, 'Fondo no encontrado'));
  const rf = f.kind === 'rf';
  const tiles = [['Último mes', f.mes], ['Año', f.ytd], ['1 año', f.a1], ['3 años', f.r3], ['5 años', f.r5], ['10 años', f.r10]];
  const extra = [];
  if (rf) { extra.push(['TIR', f.tir == null ? null : nf(f.tir, 2) + '%'], ['Duración, años', f.duracion == null ? null : nf(f.duracion, 1)]); }
  else { if (f.per) extra.push(['PER', f.per]); if (f.dividendo) extra.push(['Dividendo', f.dividendo]); }
  const tile = (l, v, raw, key) => h('div', { class: 'tile' + (key ? ' key' : '') }, h('small', {}, l), h('strong', { class: raw ? '' : cls(v) }, raw ? (v == null ? '–' : v) : pct(v, 2)));
  const blocks = [];
  const add = (t, txt) => { if (!placeholder(txt)) blocks.push(h('div', {}, h('h3', {}, t), h('p', {}, txt))); };
  const pasado = () => {
    if (f.literal) {
      const q = h('div', { class: 'quote' }, f.literal.split(/\n\n+/).map(p => h('p', {}, p)));
      const long = f.literal.length > 1500;
      const box = h('div', { class: 'qbox' + (long ? ' cut' : '') }, q);
      const kids = [h('h3', {}, 'Qué ha pasado'), h('div', { class: 'cap' }, 'Palabras del gestor, tal como figuran en la ficha'), box];
      if (long) { const bt = h('button', { class: 'more', type: 'button' }, 'Leer todo'); bt.onclick = () => { const o = box.classList.toggle('cut'); bt.textContent = o ? 'Leer todo' : 'Leer menos'; }; kids.push(bt); }
      blocks.push(h('div', {}, kids));
    } else {
      const txt = rf ? f.que_ha_pasado : f.comentario;
      if (!placeholder(txt)) blocks.push(h('div', {}, h('h3', {}, 'Qué ha pasado'), h('div', { class: 'cap' }, 'Resumen'), h('p', {}, txt)));
    }
  };
  if (rf) { pasado(); add('Posicionamiento', f.posicionamiento); add('Ha aportado', f.aporta); add('Ha restado', f.resta);
    if (f.tipo_yield && f.tir != null && f.tipo_yield.length > 14) add('Sobre la TIR', f.tipo_yield); }
  else { add('Principales posiciones', f.posiciones); pasado(); add('Lectura propia', f.lectura); }
  const nombrePdf = f.pdf ? f.pdf.split('/').pop() : '';
  const ficha = f.pdf ? h('a', { class: 'ficha', href: encodeURI(f.pdf), download: nombrePdf, 'aria-label': 'Descargar la ficha en PDF' },
    f.mini ? h('img', { src: encodeURI(f.mini), alt: 'Primera página de la ficha', loading: 'lazy' }) : null,
    h('span', { class: 'ft' }, h('b', {}, 'Ficha mensual'), h('small', {}, f.fecha || f.fecha_ficha || ''), h('span', { class: 'dl' }, 'Descargar PDF'))) : null;
  return h('section', { class: 'fund' }, h('h2', {}, f.fondo),
    h('div', { class: 'sub' }, f.gestora + ' · ' + f.isin + (f.estilo ? ' · ' + f.estilo : f.tipo ? ' · ' + f.tipo : '')),
    h('div', { class: 'tiles' }, ...(rf ? [extra.map(([l, v]) => tile(l, v, true, true)), tiles.map(([l, v]) => tile(l, v))] : [tiles.map(([l, v]) => tile(l, v)), extra.map(([l, v]) => tile(l, v, true))])),
    h('p', { class: 'note' }, 'Rentabilidad de la clase en euros. A 3, 5 y 10 años, anualizada.'),
    ficha,
    h('div', { class: 'blocks' }, blocks));
}

/* ---------- visión general ---------- */
function viewVision(kind) {
  const bloque = kind === 'rf' ? 'Renta fija' : 'Renta variable';
  const out = h('div', { class: 'vision' });
  D.vis.filter(r => r.bloque === bloque).forEach(r => {
    if (r.seccion && out.dataset.sec !== r.seccion) { out.dataset.sec = r.seccion; out.append(h('h3', {}, r.seccion.replace(/^\d+\.\s*/, ''))); }
    out.append(h('p', {}, r.texto));
  });
  return h('section', {}, h('div', { class: 'sechead' }, h('h2', {}, 'Visión general')), out);
}

/* ---------- router ---------- */
function route() {
  const hsh = decodeURIComponent((location.hash || '#/').slice(1)).split('/').filter(Boolean);
  const app = $('#app'); app.replaceChildren();
  const brand = $('#brand'), back = $('#back');
  let view, backTo = null;
  if (!hsh.length) { view = viewHome(); document.title = 'Cuaderno de fondos'; }
  else if (hsh[0] === 'rf' || hsh[0] === 'rv') { view = viewSection(hsh[0]); backTo = ['#/', 'Inicio']; document.title = (hsh[0] === 'rf' ? 'Renta fija' : 'Renta variable y mixtos') + ' · Cuaderno de fondos'; }
  else if (hsh[0] === 'fondo') { view = viewFund(hsh[1]); const f = ALL.find(x => x.isin === hsh[1]); backTo = f ? ['#/' + f.kind, f.kind === 'rf' ? 'Renta fija' : 'Renta variable y mixtos'] : ['#/', 'Inicio']; document.title = (f ? f.fondo : 'Fondo') + ' · Cuaderno de fondos'; }
  else if (hsh[0] === 'vision') { view = viewVision(hsh[1]); backTo = ['#/' + hsh[1], hsh[1] === 'rf' ? 'Renta fija' : 'Renta variable y mixtos']; document.title = 'Visión general · Cuaderno de fondos'; }
  else { view = viewHome(); }
  brand.hidden = !backTo; back.hidden = !backTo;
  if (backTo) { back.href = backTo[0]; back.textContent = '← ' + backTo[1]; }
  app.append(view);
  window.scrollTo(0, 0);
  const si = $('.home .search input'); if (si && matchMedia('(hover:hover)').matches) si.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
load().then(route).catch(() => { $('#app').replaceChildren(h('p', {}, 'No se han podido cargar los datos.')); });
</script>
